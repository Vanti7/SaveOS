services:
  # API SaveOS Production
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api-prod
    image: ghcr.io/saveos/api:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_URL: ${MINIO_URL}
      API_WORKERS: ${API_WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN}
      RESTORE_PACKAGE_DIR: ${RESTORE_PACKAGE_DIR:-/tmp/restore_packages}
    volumes:
      - ./certs:/app/certs:ro
      - borg_repos:/tmp/borg_repos
      - restore_packages:/tmp/restore_packages
    # Pas de port hôte direct : tout le trafic externe passe par Traefik
    # (voir labels ci-dessous), seul point qui termine le TLS avec un
    # certificat Let's Encrypt valide (docs/adr/0003-certificats-tls-production.md).
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker SaveOS Production
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: worker-prod
    image: ghcr.io/saveos/worker:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RESTORE_PACKAGE_DIR: ${RESTORE_PACKAGE_DIR:-/tmp/restore_packages}
      WORKER_METRICS_PORT: 9200
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    volumes:
      - borg_repos:/tmp/borg_repos
      - restore_packages:/tmp/restore_packages
    # Port des métriques exposé sur le réseau interne uniquement (plusieurs
    # replicas possibles) : le Prometheus/Grafana externe de prod scrape via
    # la découverte de service ou une adresse interne par replica, pas un
    # mapping de port hôte fixe.
    expose:
      - "9200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Interface Web Production
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web-prod
    image: ghcr.io/saveos/web:latest
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.saveos.com}
      # Appel serveur-à-serveur (web/app/lib/serverApi.ts) : reste sur le
      # réseau Docker interne, jamais exposé publiquement, donc en clair
      # (l'API ne termine plus de TLS elle-même, voir plus haut) — à ne pas
      # confondre avec NEXT_PUBLIC_API_URL, qui traverse Traefik.
      API_URL: http://api:8000
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN}
      NODE_ENV: production
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`app.${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    deploy:
      replicas: ${WEB_REPLICAS:-2}
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - api

  # PostgreSQL avec réplication
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saveos}
      POSTGRES_USER: ${POSTGRES_USER:-saveos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-local=trust"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saveos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis avec persistance
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO avec configuration de production
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Reverse Proxy (Traefik ou NGINX)
  proxy:
    image: traefik:v3.0
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      # Pas de "8080:8080" : le dashboard Traefik (--api.dashboard=true)
      # n'est plus exposé en clair et sans authentification sur l'hôte —
      # reste joignable uniquement via https://traefik.${DOMAIN} (labels
      # ci-dessous, TLS Let's Encrypt). Authentification applicative
      # (basicauth) volontairement hors scope, voir
      # docs/adr/0003-certificats-tls-production.md.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"

  # Monitoring : pas de Prometheus/Grafana auto-hébergé en production — un
  # Grafana + Zabbix externes scrapent directement api:8000/metrics et
  # worker:9200/metrics (voir README.md, section Monitoring, et
  # deploy/environments.yml: production.monitoring). Le stack local
  # Prometheus/Grafana (dev uniquement) vit dans docker-compose.yml.

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  borg_repos:
    driver: local
  restore_packages:
    driver: local
  letsencrypt_data:
    driver: local

networks:
  default:
    name: saveos_prod
    driver: bridge