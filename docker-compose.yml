services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: saveos_postgres
    environment:
      POSTGRES_DB: saveos
      POSTGRES_USER: saveos
      POSTGRES_PASSWORD: saveos123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saveos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour la queue
  redis:
    image: redis:7-alpine
    container_name: saveos_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO pour le stockage S3-compatible
  minio:
    image: minio/minio:latest
    container_name: saveos_minio
    environment:
      MINIO_ROOT_USER: saveos
      MINIO_ROOT_PASSWORD: saveos123456
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # API SaveOS
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: saveos_api
    environment:
      DATABASE_URL: postgresql://saveos:saveos123@postgres:5432/saveos
      REDIS_URL: redis://redis:6379/0
      # Token statique du tableau de bord (pont d'auth temporaire MVP, voir
      # docs/adr/0001-restauration-granulaire-mvp.md). À définir en .env.
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:-}
      # Secret de signature des JWT de session utilisateur, voir
      # docs/adr/0005-gestion-utilisateurs-roles.md. À définir en .env.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      RESTORE_PACKAGE_DIR: /tmp/restore_packages
    volumes:
      - ./certs:/app/certs
      - borg_repos:/tmp/borg_repos
      - restore_packages:/tmp/restore_packages
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker SaveOS
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: saveos_worker
    environment:
      DATABASE_URL: postgresql://saveos:saveos123@postgres:5432/saveos
      REDIS_URL: redis://redis:6379/0
      RESTORE_PACKAGE_DIR: /tmp/restore_packages
      WORKER_METRICS_PORT: 9200
      # Mode multiprocess prometheus_client : chaque job RQ s'exécute dans
      # un processus enfant forké (voir worker/tasks.py::_start_metrics_server).
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    volumes:
      - borg_repos:/tmp/borg_repos
      - restore_packages:/tmp/restore_packages
    ports:
      - "9200:9200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus (développement local uniquement — en production, un
  # Prometheus/Grafana externe scrape directement api:8000/metrics et
  # worker:9200/metrics, voir README.md)
  prometheus:
    image: prom/prometheus:latest
    container_name: saveos_prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker

  # Grafana (développement local uniquement)
  grafana:
    image: grafana/grafana:latest
    container_name: saveos_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Interface Web SaveOS
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: saveos_web
    environment:
      # Utilisée côté serveur (SSR, rewrite Next.js) : nom DNS interne au réseau Docker.
      API_URL: https://api:8000
      # Utilisée côté navigateur : doit être une adresse joignable depuis le poste client.
      # Surchargez avec PUBLIC_API_URL (ex: https://mon-domaine.example:8000) hors environnement local.
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://localhost:8000}
      # Côté serveur uniquement (routes /app/api/**) : ne jamais préfixer par NEXT_PUBLIC_,
      # sous peine d'exposer le token au navigateur. Doit être identique à celui de l'API.
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:-}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  borg_repos:
    driver: local
  restore_packages:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: saveos_network