name: Simple CI (No Cache)

on:
  push:
    branches: [ develop, feature/* ]
  pull_request:
    branches: [ develop, main, master ]

jobs:
  # Tests Python ultra-simples
  python-tests:
    name: Tests Python
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies (no cache)
      run: |
        python -m pip install --upgrade pip --no-cache-dir
        pip install --no-cache-dir -r requirements.txt
        pip install --no-cache-dir flake8 black isort

    - name: Code quality
      run: |
        echo "🔍 Vérification du code..."
        flake8 api/ worker/ agent/ --max-line-length=100 --ignore=E203,W503 || echo "⚠️ Warnings flake8"
        black --check api/ worker/ agent/ || echo "⚠️ Formatage à améliorer"
        echo "✅ Vérifications terminées"

    # Bloquant : contrairement au reste de ce job (lint), un test qui échoue
    # ici fait échouer le job. Sur fixtures SQLite (tests/conftest.py) —
    # aucun service externe requis, exclut les tests marqués "integration".
    - name: Tests pytest (bloquant)
      run: |
        pytest tests/ -v -m "not integration" \
          --cov=api --cov=worker --cov=agent --cov-report=term-missing \
          --cov-fail-under=60

  # Tests Web ultra-simples
  web-tests:
    name: Tests Web
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies (no cache)
      working-directory: web
      run: |
        echo "📦 Installation des dépendances..."
        npm install --no-optional
        echo "✅ Dépendances installées"

    # Bloquants (contrairement au job python-tests, aucun de ces
    # échecs n'était détecté avant : build/lint/types/tests web
    # n'empêchaient jamais rien).
    - name: Lint
      working-directory: web
      run: npm run lint

    - name: Vérification des types
      working-directory: web
      run: npx tsc --noEmit

    - name: Tests unitaires (Vitest)
      working-directory: web
      run: npm run test

    - name: Build
      working-directory: web
      run: npm run build

  # Validation Docker simple
  docker-check:
    name: Docker Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate docker files
      run: |
        echo "🐳 Validation Docker..."
        
        # Vérifier que les fichiers existent
        ls -la Dockerfile* docker-compose*
        
        # Validation syntaxe (si docker compose est disponible)
        docker compose config || echo "⚠️ docker compose pas disponible"
        docker compose -f docker-compose.prod.yml config || echo "⚠️ docker compose pas disponible"
        
        echo "✅ Fichiers Docker vérifiés"

  # Résumé final
  summary:
    name: Résumé CI
    runs-on: ubuntu-latest
    needs: [python-tests, web-tests, docker-check]
    if: always()
    
    steps:
    - name: CI Summary
      run: |
        echo "📊 RÉSUMÉ CI SIMPLE"
        echo "=================="
        echo "Python Tests: ${{ needs.python-tests.result }}"
        echo "Web Tests: ${{ needs.web-tests.result }}"
        echo "Docker Check: ${{ needs.docker-check.result }}"
        echo ""
        
        if [[ "${{ needs.python-tests.result }}" == "success" && "${{ needs.web-tests.result }}" == "success" ]]; then
          echo "🎉 CI RÉUSSI - Prêt pour merge!"
        else
          echo "⚠️ Certains tests ont échoué mais c'est OK pour le dev"
        fi